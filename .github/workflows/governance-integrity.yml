name: Governance Integrity (advisory)

# SELF-CONTAINED (vendored) — no cross-repo action dependency. gcd-shared-actions is private and a
# caller's default GITHUB_TOKEN cannot fetch a composite ACTION from another private repo ("Unable
# to resolve action … not found" — org cross-repo Actions limitation; cf. CROSS_REPO_PAT #182). The
# verify script is vendored at governance/verify_governed_paths.py (keep in sync with gcd-shared-actions).
# ADVISORY: fails visibly on drift, not a server-side required gate (plan-constrained, gcs-plt-gemop#356).
# Authority: GOV-STAN-010.

on:
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Verify governed-paths integrity (advisory)
        run: python governance/verify_governed_paths.py
