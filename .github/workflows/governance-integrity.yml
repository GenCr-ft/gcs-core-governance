name: Governance Integrity (advisory)

# Adopts the reusable governance-integrity check published in gcd-shared-actions#101 to verify
# this repo's drift-block governed files (governance/governed-paths.yaml) against its committed
# baseline (governance/governed-paths.sha256). ADVISORY — fails visibly on drift, not a
# server-side required gate (plan-constrained, gcs-plt-gemop#356). Authority: GOV-STAN-010.
#
# Uses the gcd-shared-actions composite action (#105/#106), pinned by full COMMIT SHA — a moving
# tag is unsafe on self-hosted runners (action cache serves stale tags; actions/runner#145).

on:
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: GenCr-ft/gcd-shared-actions/.github/actions/governance-integrity@e1242e7b00050437b05d597dfd3df1416da205d5
